<title>Paletizador 1 — Secuencia de arranque</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   GUÍA DE EDICIÓN RÁPIDA
   ───────────────────────────────────────────────────────────────
   Para MOVER un botón: cambia top (arriba/abajo) y left (izq/der)
   Para cambiar TAMAÑO del área de clic: cambia width y height
   Todos los valores son PORCENTAJES sobre el tamaño del panel.
   ═══════════════════════════════════════════════════════════════ */

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #d8d4cc;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
}

/* ── Contenedor del panel ──────────────────────────────────── */
.panel-wrap {
  position: relative;
  width: 100%;
  max-width: 960px;  /* ← ANCHO del panel en pantalla. Aumenta para hacerlo más grande */
}
.panel-wrap img.fondo {
  width: 100%;
  display: block;
  border-radius: 12px;
  border: 3px solid #888;
  box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  user-select: none;
  pointer-events: none;
}

/* ── Capa de botones ────────────────────────────────────────── */
.overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* ── Botón base (área de clic invisible) ───────────────────── */
.btn-hit {
  position: absolute;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  outline: none;
  transition: transform 0.12s, box-shadow 0.2s;
}
.btn-hit:disabled { cursor: not-allowed; }
.btn-hit:hover:not(:disabled)  { transform: translate(-50%, -50%) scale(1.1);  }
.btn-hit:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.88); }

/* ════════════════════════════════════════════════════════════
   POSICIONES DE LOS BOTONES
   top  = % desde el borde superior del panel
   left = % desde el borde izquierdo del panel
   width/height = tamaño del área clicable en % del panel

   La imagen original mide 1536 × 1024 px.
   Fórmula: left = (píxeles_x / 1536) * 100
             top  = (píxeles_y / 1024) * 100
   ════════════════════════════════════════════════════════════ */

/* ─ PASO 1: SELECTOR ROTATIVO — abajo a la derecha ───────── */
#btn-selector {
  top:   82%;    /* ↕ sube el número para subir el botón, bájalo para bajarlo */
  left:  815px;  /* ↔ sube para moverlo a la derecha */
  width:  7%;    /* tamaño del área de clic (horizontal) */
  height: 12%;   /* tamaño del área de clic (vertical) */
}

/* ─ PASO 2: BOTÓN AMARILLO — centro inferior ─────────────── */
#btn-amarillo {
  top:   518px;    /* ↕ */
  left:  359px;  /* ↔ */
  width:  7%;
  height: 11%;
}

/* ─ PASO 3: BOTÓN VERDE — arriba derecha ────────────────── */
#btn-verde {
  top:   23%;    /* ↕ */
  left:  86%;  /* ↔ */
  width:  7%;
  height: 11%;
}

/* ── Animaciones de estado ──────────────────────────────── */
/* Parpadeo dorado = "este es el siguiente paso" */
.target { animation: pulso 0.85s infinite; }
@keyframes pulso {
  0%,100% { box-shadow: 0 0 0 7px rgba(240,192,0,0.95), 0 0 26px 7px rgba(240,192,0,0.6); }
  50%      { box-shadow: 0 0 0 3px rgba(180,140,0,0.7),  0 0  8px 2px rgba(180,140,0,0.3); }
}
/* Anillo verde = "completado" */
.done {
  box-shadow: 0 0 0 6px rgba(30,220,30,0.9), 0 0 18px rgba(30,220,30,0.5) !important;
  animation: none !important;
}

/* ── Barra de estado ────────────────────────────────────── */
.status-bar {
  margin-top: 14px;
  background: #111;
  color: white;
  border-radius: 10px;
  padding: 13px 20px;
  width: 100%;
  max-width: 960px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.status-msg { font-size: 14px; font-weight: 500; flex: 1; }
.step-dots  { display: flex; gap: 10px; }
.dot        { width: 14px; height: 14px; border-radius: 50%; background: #333; transition: background 0.3s; }
.dot.active   { background: #f0c000; }
.dot.complete { background: #22cc22; }

.feedback {
  text-align: center; font-size: 13px; font-weight: 600;
  min-height: 22px; margin-top: 8px;
  width: 100%; max-width: 960px;
}
.hint { color: #666; } .ok { color: #1a9a1a; } .err { color: #cc2200; }

.win {
  display: none; background: #145c14; color: white;
  border-radius: 10px; padding: 18px; text-align: center;
  margin-top: 10px; width: 100%; max-width: 960px;
}
.win.show { display: block; animation: fadeUp 0.4s; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.win h2 { font-size: 22px; margin-bottom: 6px; }
.win p  { font-size: 14px; opacity: 0.85; }
.reset-btn {
  margin-top: 12px; background: white; color: #145c14;
  border: none; border-radius: 6px; padding: 8px 22px;
  font-size: 14px; font-weight: 900; cursor: pointer;
}
.reset-btn:hover { background: #e8ffe8; }
</style>

<script>
var step  = 0;
var sel   = document.getElementById("btn-selector");
var amar  = document.getElementById("btn-amarillo");
var verde = document.getElementById("btn-verde");
var msg   = document.getElementById("msg");
var fb    = document.getElementById("fb");
var dots  = [document.getElementById("d1"), document.getElementById("d2"), document.getElementById("d3")];

function clearAll() {
  [sel, amar, verde].forEach(function(b) {
    b.classList.remove("target", "done");
    b.disabled = true;
  });
}

function updateUI() {
  clearAll();
  if (step === 0) {
    sel.classList.add("target"); sel.disabled = false;
    msg.textContent = "Paso 1 de 3 — Gira el selector a modo manual (✋)";
    fb.textContent  = "↘ El selector rotativo está abajo a la derecha — ¡púlsalo!";
    fb.className = "feedback hint";
    dots[0].className = "dot active"; dots[1].className = "dot"; dots[2].className = "dot";
  } else if (step === 1) {
    sel.classList.add("done");
    amar.classList.add("target"); amar.disabled = false;
    msg.textContent = "Paso 2 de 3 — Pulsa el botón amarillo (inferior central)";
    fb.textContent  = "✓ Selector en manual — ahora el botón amarillo del centro";
    fb.className = "feedback ok";
    dots[0].className = "dot complete"; dots[1].className = "dot active"; dots[2].className = "dot";
  } else if (step === 2) {
    sel.classList.add("done"); amar.classList.add("done");
    verde.classList.add("target"); verde.disabled = false;
    msg.textContent = "Paso 3 de 3 — Pulsa el botón verde (arriba derecha)";
    fb.textContent  = "✓ Botón amarillo pulsado — ahora el botón verde de arriba a la derecha";
    fb.className = "feedback ok";
    dots[0].className = "dot complete"; dots[1].className = "dot complete"; dots[2].className = "dot active";
  }
}

function handleClick(which) {
  if (which === "selector" && step === 0) {
    step = 1; updateUI();
  } else if (which === "amarillo" && step === 1) {
    step = 2; updateUI();
  } else if (which === "verde" && step === 2) {
    step = 3;
    clearAll();
    sel.classList.add("done"); amar.classList.add("done"); verde.classList.add("done");
    dots[0].className = "dot complete"; dots[1].className = "dot complete"; dots[2].className = "dot complete";
    msg.textContent = "¡Paletizador arrancado en modo manual!";
    fb.textContent  = "";
    document.getElementById("win").classList.add("show");
  } else {
    fb.textContent  = "⚠ Ese no es el paso correcto — sigue la secuencia indicada";
    fb.className = "feedback err";
    setTimeout(function() { if (step < 3) updateUI(); }, 1600);
  }
}

function resetGame() {
  step = 0;
  document.getElementById("win").classList.remove("show");
  updateUI();
}

updateUI();
</script>

</body></html>
